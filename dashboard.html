<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard – TanamanKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="dashboard">
    <div class="app">
        <aside id="side"></aside>
        <main class="main">
            <div class="top">
                <h1 id="judul">Dashboard</h1>
                <div class="who" id="who"></div>
            </div>
            <div class="grid stats" id="stats"></div>
            <div class="grid two">
                <section class="card">
                    <h3>📅 Jadwal Hari Ini</h3>
                    <div id="hari"></div><a class="btn o sm" href="jadwal.html">Lihat semua jadwal</a>
                </section>
                <section class="card">
                    <h3>⛅ Cuaca &amp; Rekomendasi</h3>
                    <div class="weather">29°C</div>
                    <p class="muted">Contoh tampilan cuaca (data statis). Siram tanaman di pagi atau sore hari.</p>
                    <h3 style="margin-top:16px">🌱 Tanaman Terbaru</h3>
                    <div id="baru"></div>
                </section>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
