<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rekap / Laporan – TanamanKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="rekap">
    <div class="app">
        <aside id="side"></aside>
        <main class="main">
            <div class="top">
                <h1 id="judul">Rekap / Laporan</h1>
                <div class="who" id="who"></div>
            </div>
            <div class="card">
                <div class="bar"><input id="d1" type="date" title="Dari"><input id="d2" type="date"
                        title="Sampai"><select id="fa">
                        <option value="">Semua aktivitas</option>
                        <option>Penyiraman</option>
                        <option>Pemupukan</option>
                    </select><button class="btn" onclick="window.print()">🖨️ Cetak</button></div>
            </div>
            <div class="grid stats" id="sum"></div>
            <div class="grid two">
                <section class="card">
                    <h3>📈 Progres Aktivitas</h3>
                    <div id="chart"></div>
                </section>
                <section class="card">
                    <h3>🗒️ Riwayat</h3>
                    <div class="tw">
                        <table>
                            <thead>
                                <tr>
                                    <th>Tanggal</th>
                                    <th>Tanaman</th>
                                    <th>Aktivitas</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="tr"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
