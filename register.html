<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registrasi – TanamanKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="register">
    <div class="auth">
        <div class="acard">
            <div class="logo">🌿</div>
            <h2>Daftar Akun</h2>
            <p class="muted">Mulai catat tanamanmu hari ini</p>
            <form id="fr">
                <div class="fg"><label for="nama">Nama Lengkap</label><input id="nama" placeholder="Nama Anda" required>
                </div>
                <div class="fg"><label for="email">Email</label><input id="email" type="email"
                        placeholder="email@contoh.com" required></div>
                <div class="fg"><label for="pass">Password</label><input id="pass" type="password"
                        placeholder="Minimal 8 karakter" required></div>
                <div class="fg"><label for="pass2">Konfirmasi Password</label><input id="pass2" type="password"
                        placeholder="Ulangi password" required></div>
                <div class="err" id="err"></div><button class="btn" type="submit">Daftar</button>
            </form>
            <p class="alt">Sudah punya akun? <a href="login.html">Login</a></p>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
