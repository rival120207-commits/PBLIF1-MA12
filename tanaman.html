<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kelola Tanaman – TanamanKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="tanaman">
    <div class="app">
        <aside id="side"></aside>
        <main class="main">
            <div class="top">
                <h1 id="judul">Kelola Tanaman</h1>
                <div class="who" id="who"></div>
            </div>
            <div class="card">
                <div class="bar"><input id="q" placeholder="🔍 Cari nama tanaman..."><select id="fj">
                        <option value="">Semua jenis</option>
                        <option>Hias</option>
                        <option>Bunga</option>
                        <option>Sayur</option>
                        <option>Buah</option>
                    </select><a class="btn" href="form-tanaman.html">+ Tambah Tanaman</a></div>
                <div class="tw">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Foto</th>
                                <th>Nama</th>
                                <th>Jenis</th>
                                <th>Lokasi</th>
                                <th>Tgl Tanam</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tb"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
