<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login – TanamanKu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="login">
    <div class="auth">
        <div class="acard">
            <div class="logo">🌱</div>
            <h2>Selamat Datang</h2>
            <p class="muted">Aplikasi Pencatatan Tanaman &amp; Jadwal</p>
            <form id="fl">
                <div class="fg"><label for="email">Email</label><input id="email" type="email"
                        placeholder="admin@tanaman.com" required></div>
                <div class="fg"><label for="pass">Password</label><input id="pass" type="password"
                        placeholder="••••••••" required></div>
                <div class="err" id="err"></div><button class="btn" type="submit">Login</button>
            </form>
            <p class="alt">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
            <p class="muted" style="text-align:center;font-size:12px">Akun demo: admin@tanaman.com / 12345678</p>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
